# stored at /etc/nginx/conf.d/dvmcarpool.conf

server {
    listen 80;
    server_name dvmcarpool.duckdns.org www.dvmcarpool.duckdns.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dvmcarpool.duckdns.org www.dvmcarpool.duckdns.org;
    
    ssl_certificate /etc/letsencrypt/live/dvmcarpool.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dvmcarpool.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}